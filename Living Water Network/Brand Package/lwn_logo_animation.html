<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Living Water Network</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: #10203A;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: Georgia, 'Times New Roman', serif;
  }

  /* ── Scene ─────────────────────────────────── */
  .scene {
    position: relative;
    width: 520px;
    height: 660px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  /* ── Ambient glow ──────────────────────────── */
  .glow {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    width: 340px;
    height: 340px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(30,132,144,0.18) 0%, transparent 70%);
    animation: glowBreath 5s ease-in-out 1.8s infinite;
    opacity: 0;
  }
  @keyframes glowBreath {
    0%   { opacity: 0; transform: translateX(-50%) scale(0.94); }
    30%  { opacity: 1; }
    70%  { opacity: 0.8; }
    100% { opacity: 0; transform: translateX(-50%) scale(1.06); }
  }

  /* ── Globe wrap ────────────────────────────── */
  .globe-wrap {
    position: relative;
    width: 300px;
    height: 300px;
    margin-top: 40px;
    opacity: 0;
    animation: riseIn 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
  }
  @keyframes riseIn {
    0%   { opacity:0; transform: translateY(48px) scale(0.72); }
    100% { opacity:1; transform: translateY(0)   scale(1); }
  }

  /* ── Water arms (rise up alongside globe) ─── */
  .arm {
    position: absolute;
    top: 0;
    width: 300px;
    height: 300px;
    overflow: visible;
    pointer-events: none;
  }
  .arm-path {
    fill: none;
    stroke-linecap: round;
    stroke-dasharray: 500;
    stroke-dashoffset: 500;
    animation: drawArm 2s ease-out 1.2s forwards;
  }
  @keyframes drawArm {
    to { stroke-dashoffset: 0; }
  }

  /* ── Globe SVG layers ──────────────────────── */
  .globe-base {
    position: absolute;
    top: 0; left: 0;
    width: 300px; height: 300px;
  }
  .globe-spin {
    position: absolute;
    top: 0; left: 0;
    width: 300px; height: 300px;
    transform-origin: 150px 150px;
    animation: gentleSpin 80s linear 2s infinite;
  }
  @keyframes gentleSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .globe-top {
    position: absolute;
    top: 0; left: 0;
    width: 300px; height: 300px;
    pointer-events: none;
  }

  /* ── Wave lines ────────────────────────────── */
  .waves {
    position: relative;
    width: 520px;
    height: 110px;
    margin-top: -28px;
    overflow: visible;
  }
  .wave-line {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
  }
  .w1 { animation: waveFade 1s ease-out 1.8s forwards; top: 18px; }
  .w2 { animation: waveFade 1s ease-out 2.1s forwards; top: 42px; }
  .w3 { animation: waveFade 1s ease-out 2.4s forwards; top: 64px; }
  .w4 { animation: waveFade 1s ease-out 2.7s forwards; top: 84px; }

  @keyframes waveFade {
    from { opacity: 0; transform: translateX(-50%) scaleX(0.6); }
    to   { opacity: 1; transform: translateX(-50%) scaleX(1); }
  }

  /* ── Text ──────────────────────────────────── */
  .text-block {
    text-align: center;
    margin-top: 16px;
    opacity: 0;
    animation: textUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) 2.6s forwards;
  }
  @keyframes textUp {
    from { opacity:0; transform:translateY(24px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .wordmark {
    font-size: 52px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #F4EFE8;
    line-height: 1;
    text-shadow: 0 2px 40px rgba(30,132,144,0.25);
  }

  .rule-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 10px 0 8px;
    opacity: 0;
    animation: textUp 1.2s ease-out 3.1s forwards;
  }
  .side-rule { width: 64px; height: 1px; background: rgba(23,53,85,0.7); }
  .gold-dot  { width: 5px; height: 5px; border-radius: 50%; background: #C8893C; opacity: 0.7; }

  .network {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 12px;
    color: #38AABA;
    text-transform: uppercase;
    opacity: 0;
    animation: textUp 1.2s ease-out 3.1s forwards;
  }

  /* ── Scripture ─────────────────────────────── */
  .scripture {
    position: absolute;
    bottom: 28px;
    left: 0; right: 0;
    text-align: center;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 10px;
    color: rgba(122,191,204,0.45);
    letter-spacing: 0.5px;
    opacity: 0;
    animation: textUp 1.2s ease-out 3.6s forwards;
  }

  /* ── Replay ────────────────────────────────── */
  .replay {
    position: fixed;
    bottom: 24px; right: 24px;
    background: transparent;
    border: 1px solid rgba(56,170,186,0.35);
    color: #38AABA;
    padding: 8px 18px;
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    cursor: pointer;
    border-radius: 3px;
    transition: border-color 0.2s, background 0.2s;
    opacity: 0;
    animation: textUp 0.8s ease 4.2s forwards;
  }
  .replay:hover { background: rgba(56,170,186,0.1); border-color: #38AABA; }
</style>
</head>
<body>

<div class="scene">

  <!-- Ambient glow -->
  <div class="glow"></div>

  <!-- Globe -->
  <div class="globe-wrap">

    <!-- Water pool behind globe -->
    <svg style="position:absolute;top:0;left:0;width:300px;height:300px;overflow:visible;" viewBox="0 0 300 300">
      <ellipse cx="150" cy="285" rx="170" ry="52" fill="#145E6E" opacity="0.38"
        style="animation:riseIn 1.8s ease 0.2s both"/>
      <ellipse cx="150" cy="291" rx="132" ry="34" fill="#1E8490" opacity="0.24"
        style="animation:riseIn 1.8s ease 0.3s both"/>
    </svg>

    <!-- Water arms -->
    <svg class="arm" viewBox="0 0 300 300" overflow="visible">
      <!-- Left arm outer -->
      <path class="arm-path"
        d="M132,287 C 80,272 28,246 4,210 C -16,178 -8,142 14,116 C 28,98 48,90 62,88"
        stroke="#145E6E" stroke-width="26" opacity="0.48"/>
      <!-- Left arm inner current -->
      <path class="arm-path"
        d="M132,287 C 80,272 28,246 4,210 C -16,178 -8,142 14,116 C 28,98 48,90 62,88"
        stroke="#1E8490" stroke-width="12" opacity="0.55"
        style="animation-delay:1.35s"/>
      <!-- Left arm surface thread -->
      <path class="arm-path"
        d="M130,289 C 78,273 26,247 2,211 C -18,179 -10,143 12,117 C 26,99 46,91 60,89"
        stroke="#4BBFCE" stroke-width="3.5" opacity="0.42"
        style="animation-delay:1.5s"/>

      <!-- Right arm outer -->
      <path class="arm-path"
        d="M168,287 C 220,272 272,246 296,210 C 316,178 308,142 286,116 C 272,98 252,90 238,88"
        stroke="#145E6E" stroke-width="26" opacity="0.48"
        style="animation-delay:1.25s"/>
      <!-- Right arm inner -->
      <path class="arm-path"
        d="M168,287 C 220,272 272,246 296,210 C 316,178 308,142 286,116 C 272,98 252,90 238,88"
        stroke="#1E8490" stroke-width="12" opacity="0.55"
        style="animation-delay:1.4s"/>
      <!-- Right arm thread -->
      <path class="arm-path"
        d="M170,289 C 222,273 274,247 298,211 C 318,179 310,143 288,117 C 274,99 254,91 240,89"
        stroke="#4BBFCE" stroke-width="3.5" opacity="0.42"
        style="animation-delay:1.55s"/>
    </svg>

    <!-- Globe base (static) -->
    <svg class="globe-base" viewBox="0 0 300 300">
      <defs>
        <radialGradient id="ocean" cx="42%" cy="38%" r="62%">
          <stop offset="0%"   stop-color="#1E5080"/>
          <stop offset="55%"  stop-color="#132E52"/>
          <stop offset="100%" stop-color="#0C1E3C"/>
        </radialGradient>
        <clipPath id="gc">
          <circle cx="150" cy="150" r="124"/>
        </clipPath>
      </defs>
      <!-- Ocean -->
      <circle cx="150" cy="150" r="124" fill="url(#ocean)"/>
      <!-- Gold equator + meridian -->
      <g clip-path="url(#gc)">
        <line x1="26" y1="150" x2="274" y2="150" stroke="#C8893C" stroke-width="0.9" opacity="0.28"/>
        <line x1="150" y1="26"  x2="150" y2="274" stroke="#C8893C" stroke-width="0.9" opacity="0.28"/>
        <line x1="30" y1="114" x2="270" y2="114" stroke="#C8893C" stroke-width="0.5" opacity="0.14"/>
        <line x1="30" y1="186" x2="270" y2="186" stroke="#C8893C" stroke-width="0.5" opacity="0.14"/>
      </g>
    </svg>

    <!-- Spinning layer (just has continents — gives subtle rotation) -->
    <svg class="globe-spin" viewBox="0 0 300 300">
      <defs>
        <clipPath id="gc2">
          <circle cx="150" cy="150" r="124"/>
        </clipPath>
      </defs>
      <g clip-path="url(#gc2)" fill="#C8893C">
        <!-- Americas -->
        <path d="M55,56 L72,46 L90,51 L100,68 L103,92 L94,115 L85,136 L79,160 L70,182 L61,202 L52,214 L42,199 L38,172 L42,146 L47,118 L45,90 L52,70 Z" opacity="0.88"/>
        <path d="M70,216 L84,210 L91,228 L84,254 L71,265 L58,252 L56,230 L64,216 Z" opacity="0.72"/>
        <!-- Africa/Europe -->
        <path d="M155,48 L175,42 L192,51 L200,70 L202,96 L191,113 L180,106 L171,120 L168,144 L166,169 L171,193 L182,210 L178,233 L164,242 L151,233 L142,213 L139,189 L144,165 L139,140 L141,114 L147,96 L145,70 Z" opacity="0.82"/>
        <!-- Asia hint -->
        <path d="M220,58 L242,50 L258,62 L261,84 L257,108 L241,118 L218,112 L207,94 L211,66 Z" opacity="0.65"/>
      </g>
    </svg>

    <!-- Globe top: ring + sheen (static, on top) -->
    <svg class="globe-top" viewBox="0 0 300 300">
      <!-- Sheen -->
      <path d="M68,68 A124,124 0 0,1 214,42"
        fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.1"/>
      <!-- Ring -->
      <circle cx="150" cy="150" r="124"
        fill="none" stroke="#1E8490" stroke-width="2.8"/>
    </svg>

  </div><!-- /globe-wrap -->

  <!-- Wave lines -->
  <div class="waves">
    <svg class="wave-line w1" viewBox="0 0 380 28" width="380" height="28">
      <path d="M18,14 Q96,2 190,10 Q284,18 362,4"
        fill="none" stroke="#1E8490" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <svg class="wave-line w2" viewBox="0 0 420 28" width="420" height="28">
      <path d="M18,14 Q106,2 210,10 Q314,18 402,4"
        fill="none" stroke="#1E8490" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
    </svg>
    <svg class="wave-line w3" viewBox="0 0 460 28" width="460" height="28">
      <path d="M18,14 Q116,2 230,10 Q344,18 442,5"
        fill="none" stroke="#145E6E" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
    </svg>
    <svg class="wave-line w4" viewBox="0 0 400 28" width="400" height="28">
      <path d="M28,14 Q100,4 200,11 Q300,18 372,6"
        fill="none" stroke="#C8893C" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
    </svg>
  </div>

  <!-- Text -->
  <div class="text-block">
    <div class="wordmark">LIVING WATER</div>
  </div>
  <div class="rule-row">
    <div class="side-rule"></div>
    <div class="gold-dot"></div>
    <div class="network">Network</div>
    <div class="gold-dot"></div>
    <div class="side-rule"></div>
  </div>

  <!-- Scripture -->
  <div class="scripture">
    "rivers of living water will flow from within them" — John 7:38
  </div>

</div><!-- /scene -->

<button class="replay" onclick="location.reload()">↺ REPLAY</button>

<script>
  // Subtle water particle drift
  const body = document.body;
  for (let i = 0; i < 18; i++) {
    const d = document.createElement('div');
    const size = Math.random() * 3 + 1.2;
    const x = Math.random() * 100;
    const delay = Math.random() * 6;
    const dur = 9 + Math.random() * 8;
    const col = ['rgba(56,170,186,0.5)', 'rgba(75,191,206,0.4)', 'rgba(200,137,60,0.35)'][Math.floor(Math.random()*3)];
    d.style.cssText = `
      position:fixed; border-radius:50%;
      width:${size}px; height:${size}px;
      left:${x}%; bottom:-10px;
      background:${col};
      animation: drift ${dur}s ease-in-out ${delay}s infinite;
      pointer-events:none;
    `;
    body.appendChild(d);
  }

  const style = document.createElement('style');
  style.textContent = `
    @keyframes drift {
      0%   { opacity:0; transform: translateY(0)    translateX(0); }
      15%  { opacity:0.7; }
      85%  { opacity:0.4; }
      100% { opacity:0; transform: translateY(-95vh) translateX(${(Math.random()-0.5)*60}px); }
    }
  `;
  document.head.appendChild(style);
</script>
</body>
</html>
