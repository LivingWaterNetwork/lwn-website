<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 130" width="580" height="130">
  <defs>
    <linearGradient id="wordmarkBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1C3A"/>
      <stop offset="100%" stop-color="#0B1C3A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="580" height="130" fill="#0B1C3A"/>

  <!-- Ember accent mark — small globe ring icon -->
  <circle cx="40" cy="65" r="20" fill="none" stroke="#00C8DC" stroke-width="1.5" opacity="0.9"/>
  <line x1="40" y1="45" x2="40" y2="85" stroke="#00C8DC" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="40" cy="65" rx="10" ry="20" fill="none" stroke="#00C8DC" stroke-width="0.8" opacity="0.6"/>
  <line x1="20" y1="65" x2="60" y2="65" stroke="#00C8DC" stroke-width="0.8" opacity="0.6"/>
  <!-- Tiny wave below icon -->
  <path d="M26,82 Q40,90 54,82" fill="none" stroke="#E8631A" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Divider -->
  <line x1="74" y1="30" x2="74" y2="100" stroke="#0055A5" stroke-width="1" opacity="0.5"/>

  <!-- LIVING WATER -->
  <text x="90" y="78"
    font-family="'Arial Black', 'Impact', 'Haettenschweiler', sans-serif"
    font-weight="900"
    font-size="52"
    fill="#FFFFFF"
    text-anchor="start"
    letter-spacing="2">LIVING WATER</text>

  <!-- NETWORK underline text -->
  <text x="94" y="106"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-weight="300"
    font-size="13"
    fill="#00C8DC"
    text-anchor="start"
    letter-spacing="15">NETWORK</text>

  <!-- Fine underline accent on wordmark -->
  <line x1="90" y1="112" x2="558" y2="112" stroke="#0055A5" stroke-width="0.5" opacity="0.3"/>

</svg>
