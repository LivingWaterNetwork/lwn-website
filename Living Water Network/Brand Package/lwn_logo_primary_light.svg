<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <radialGradient id="oceanL" cx="42%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#1E5080"/>
      <stop offset="55%"  stop-color="#132E52"/>
      <stop offset="100%" stop-color="#0C1E3C"/>
    </radialGradient>
    <radialGradient id="poolGradL" cx="50%" cy="40%" r="55%">
      <stop offset="0%"   stop-color="#2A9BAE"/>
      <stop offset="100%" stop-color="#145E6E"/>
    </radialGradient>
    <clipPath id="gcL">
      <circle cx="250" cy="207" r="124"/>
    </clipPath>
  </defs>

  <!-- Background — warm cream -->
  <rect width="500" height="600" fill="#F4EFE8"/>
  <!-- Subtle vignette -->
  <radialGradient id="vigL" cx="50%" cy="40%" r="65%">
    <stop offset="0%"   stop-color="#E8E2D8" stop-opacity="0"/>
    <stop offset="100%" stop-color="#DDD7CC" stop-opacity="0.35"/>
  </radialGradient>
  <rect width="500" height="600" fill="url(#vigL)"/>

  <!-- Water pool -->
  <ellipse cx="250" cy="320" rx="175" ry="56" fill="url(#poolGradL)" opacity="0.3"/>
  <ellipse cx="250" cy="326" rx="138" ry="36" fill="#38AABA" opacity="0.2"/>

  <!-- Water arms -->
  <path d="M218,316 C 162,304 106,280 78,248 C 54,220 62,183 84,157 C 97,141 115,134 128,132"
    fill="none" stroke="#145E6E" stroke-width="28" stroke-linecap="round" opacity="0.35"/>
  <path d="M218,316 C 162,304 106,280 78,248 C 54,220 62,183 84,157 C 97,141 115,134 128,132"
    fill="none" stroke="#1E8490" stroke-width="14" stroke-linecap="round" opacity="0.42"/>
  <path d="M216,318 C 160,305 104,281 76,249 C 52,221 61,184 83,158 C 96,142 114,135 127,133"
    fill="none" stroke="#4BBFCE" stroke-width="4" stroke-linecap="round" opacity="0.35"/>

  <path d="M282,316 C 338,304 394,280 422,248 C 446,220 438,183 416,157 C 403,141 385,134 372,132"
    fill="none" stroke="#145E6E" stroke-width="28" stroke-linecap="round" opacity="0.35"/>
  <path d="M282,316 C 338,304 394,280 422,248 C 446,220 438,183 416,157 C 403,141 385,134 372,132"
    fill="none" stroke="#1E8490" stroke-width="14" stroke-linecap="round" opacity="0.42"/>
  <path d="M284,318 C 340,305 396,281 424,249 C 448,221 439,184 417,158 C 404,142 386,135 373,133"
    fill="none" stroke="#4BBFCE" stroke-width="4" stroke-linecap="round" opacity="0.35"/>

  <!-- Globe ocean -->
  <circle cx="250" cy="207" r="125" fill="url(#oceanL)"/>

  <!-- Grid -->
  <g clip-path="url(#gcL)">
    <line x1="125" y1="207" x2="375" y2="207" stroke="#C8893C" stroke-width="0.9" opacity="0.3"/>
    <line x1="250" y1="82"  x2="250" y2="332" stroke="#C8893C" stroke-width="0.9" opacity="0.3"/>
    <line x1="130" y1="170" x2="370" y2="170" stroke="#C8893C" stroke-width="0.5" opacity="0.16"/>
    <line x1="130" y1="244" x2="370" y2="244" stroke="#C8893C" stroke-width="0.5" opacity="0.16"/>
  </g>

  <!-- Continents -->
  <g clip-path="url(#gcL)" fill="#C8893C">
    <path d="M 148,106 L 163,97 L 180,101 L 190,116 L 194,138 L 186,158 L 178,176 L 172,198 L 164,220 L 156,240 L 150,256 L 142,243 L 138,218 L 142,192 L 146,164 L 144,138 L 148,120 Z" opacity="0.88"/>
    <path d="M170,258 L 182,252 L 188,268 L 182,290 L 170,300 L 158,290 L 155,272 L 162,258 Z" opacity="0.75"/>
    <path d="M 252,99 L 272,94 L 290,102 L 300,120 L 303,144 L 293,160 L 281,153 L 272,166 L 268,188 L 266,212 L 271,234 L 281,252 L 277,276 L 263,288 L 250,280 L 241,263 L 238,240 L 242,218 L 238,194 L 240,168 L 245,146 L 244,122 Z" opacity="0.82"/>
    <path d="M 318,110 L 338,103 L 354,112 L 358,132 L 354,154 L 340,163 L 318,158 L 307,142 L 310,120 Z" opacity="0.68"/>
  </g>

  <!-- Sheen -->
  <path d="M 165,108 A 125,125 0 0,1 318,92" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.14"/>

  <!-- Globe ring -->
  <circle cx="250" cy="207" r="125" fill="none" stroke="#1E8490" stroke-width="2.8"/>

  <!-- Waves below -->
  <path d="M 150,366 Q 198,390 250,382 Q 302,390 350,366" fill="none" stroke="#1E8490" stroke-width="2.4" stroke-linecap="round" opacity="0.5"/>
  <path d="M 120,392 Q 182,420 250,411 Q 318,420 380,392" fill="none" stroke="#1E8490" stroke-width="1.8" stroke-linecap="round" opacity="0.3"/>
  <path d="M 95,415 Q 170,446 250,436 Q 330,446 405,415" fill="none" stroke="#145E6E" stroke-width="1.4" stroke-linecap="round" opacity="0.22"/>
  <path d="M 168,436 Q 206,452 250,446 Q 294,452 332,436" fill="none" stroke="#C8893C" stroke-width="1" stroke-linecap="round" opacity="0.32"/>

  <!-- Flanking rules -->
  <line x1="58"  y1="522" x2="148" y2="522" stroke="#1B3D5A" stroke-width="0.7" opacity="0.4"/>
  <line x1="352" y1="522" x2="442" y2="522" stroke="#1B3D5A" stroke-width="0.7" opacity="0.4"/>
  <circle cx="250" cy="522" r="2" fill="#C8893C" opacity="0.5"/>

  <!-- LIVING WATER -->
  <text x="250" y="502"
    font-family="'Georgia', 'Palatino Linotype', 'Book Antiqua', serif"
    font-weight="bold"
    font-size="44"
    fill="#10203A"
    text-anchor="middle"
    letter-spacing="1.5">LIVING WATER</text>

  <!-- NETWORK -->
  <text x="250" y="548"
    font-family="'Helvetica Neue', 'Arial', sans-serif"
    font-weight="300"
    font-size="13"
    fill="#1E8490"
    text-anchor="middle"
    letter-spacing="10">NETWORK</text>

</svg>
