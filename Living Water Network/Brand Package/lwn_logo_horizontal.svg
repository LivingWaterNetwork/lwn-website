<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" height="240">
  <defs>
    <radialGradient id="oceanH" cx="42%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#1E5080"/>
      <stop offset="55%"  stop-color="#132E52"/>
      <stop offset="100%" stop-color="#0C1E3C"/>
    </radialGradient>
    <radialGradient id="poolH" cx="50%" cy="40%" r="55%">
      <stop offset="0%"   stop-color="#2A9BAE"/>
      <stop offset="100%" stop-color="#145E6E"/>
    </radialGradient>
    <clipPath id="gcH">
      <circle cx="118" cy="112" r="82"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="700" height="240" fill="#10203A"/>

  <!-- Water pool behind globe -->
  <ellipse cx="118" cy="183" rx="112" ry="36" fill="url(#poolH)" opacity="0.4"/>
  <ellipse cx="118" cy="189" rx="88"  ry="23" fill="#38AABA" opacity="0.25"/>

  <!-- Water arms -->
  <path d="M100,180 C 64,172 30,152 12,128 C -2,107 4,81 20,62 C 30,50 44,44 54,43"
    fill="none" stroke="#145E6E" stroke-width="20" stroke-linecap="round" opacity="0.5"/>
  <path d="M100,180 C 64,172 30,152 12,128 C -2,107 4,81 20,62 C 30,50 44,44 54,43"
    fill="none" stroke="#1E8490" stroke-width="9" stroke-linecap="round" opacity="0.55"/>
  <path d="M136,180 C 172,172 206,152 224,128 C 238,107 232,81 216,62 C 206,50 192,44 182,43"
    fill="none" stroke="#145E6E" stroke-width="20" stroke-linecap="round" opacity="0.5"/>
  <path d="M136,180 C 172,172 206,152 224,128 C 238,107 232,81 216,62 C 206,50 192,44 182,43"
    fill="none" stroke="#1E8490" stroke-width="9" stroke-linecap="round" opacity="0.55"/>

  <!-- Globe -->
  <circle cx="118" cy="112" r="82" fill="url(#oceanH)"/>

  <!-- Grid -->
  <g clip-path="url(#gcH)">
    <line x1="36" y1="112" x2="200" y2="112" stroke="#C8893C" stroke-width="0.7" opacity="0.3"/>
    <line x1="118" y1="30"  x2="118" y2="194" stroke="#C8893C" stroke-width="0.7" opacity="0.3"/>
    <line x1="38" y1="86"  x2="198" y2="86"  stroke="#C8893C" stroke-width="0.4" opacity="0.15"/>
    <line x1="38" y1="138" x2="198" y2="138" stroke="#C8893C" stroke-width="0.4" opacity="0.15"/>
  </g>

  <!-- Continents -->
  <g clip-path="url(#gcH)" fill="#C8893C">
    <path d="M65,52 L75,46 L86,49 L92,60 L94,75 L89,88 L83,100 L79,114 L73,128 L68,140 L63,148 L57,139 L54,120 L57,104 L60,86 L58,68 Z" opacity="0.88"/>
    <path d="M76,150 L83,147 L87,158 L82,173 L76,179 L68,172 L67,160 L72,150 Z" opacity="0.72"/>
    <path d="M121,46 L133,42 L142,48 L147,60 L148,76 L142,86 L136,80 L131,89 L128,103 L127,118 L130,132 L137,143 L134,157 L127,163 L119,157 L114,144 L112,129 L115,116 L112,102 L113,88 L117,76 L116,60 Z" opacity="0.82"/>
    <path d="M158,54 L170,49 L178,56 L180,70 L178,83 L170,89 L158,86 L151,74 L153,59 Z" opacity="0.65"/>
  </g>

  <!-- Globe sheen -->
  <path d="M 60,58 A 82,82 0 0,1 160,42" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.1"/>
  <!-- Globe ring -->
  <circle cx="118" cy="112" r="82" fill="none" stroke="#1E8490" stroke-width="2.2"/>

  <!-- Flowing water below (2 arcs) -->
  <path d="M 48,204 Q 82,220 118,214 Q 154,220 188,204"
    fill="none" stroke="#1E8490" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
  <path d="M 30,220 Q 72,238 118,232 Q 164,238 206,220"
    fill="none" stroke="#145E6E" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>

  <!-- Vertical divider -->
  <line x1="234" y1="54" x2="234" y2="186" stroke="#1E3D5A" stroke-width="1" opacity="0.6"/>

  <!-- Gold accent dot at divider -->
  <circle cx="234" cy="120" r="3" fill="#C8893C" opacity="0.55"/>

  <!-- LIVING WATER -->
  <text x="262" y="128"
    font-family="'Georgia', 'Palatino Linotype', 'Book Antiqua', serif"
    font-weight="bold"
    font-size="54"
    fill="#F4EFE8"
    text-anchor="start"
    letter-spacing="1">LIVING WATER</text>

  <!-- NETWORK -->
  <text x="268" y="162"
    font-family="'Helvetica Neue', 'Arial', sans-serif"
    font-weight="300"
    font-size="14"
    fill="#38AABA"
    text-anchor="start"
    letter-spacing="13">NETWORK</text>

</svg>
